name: Release

# Push a tag like `v0.2.0` (matching package.json "version") to build, test and publish.
# Run manually from the Actions tab for a dry run: builds, tests and uploads the .vsix without publishing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.version.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Read version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=vibe-review-$version.vsix" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION. Bump the version and tag v$VERSION."
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - name: Package
        env:
          VSIX: ${{ steps.version.outputs.vsix }}
        run: npx vsce package --no-dependencies --out "$VSIX"

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.version.outputs.vsix }}
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings → Environments) to approve each release.
    # If the Marketplace Trusted Publishing policy names an environment, it must be this one.
    environment: marketplace
    permissions:
      contents: write
      id-token: write # Marketplace Trusted Publishing (OIDC), no PAT needed
    env:
      VSIX: ${{ needs.build.outputs.vsix }}
    steps:
      - uses: actions/checkout@v4

      # vsce 4.x (needed for --oidc) requires Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Publish to VS Code Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc --packagePath "$VSIX" --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT not set; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx publish "$VSIX" --pat "$OVSX_PAT" --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes --verify-tag
          fi
